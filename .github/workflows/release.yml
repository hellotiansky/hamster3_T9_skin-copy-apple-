
name: Build hamster3_T9_skin_copy_ios skin

on:
  # 支持手动发布；九键布局或构建脚本变更时也自动构建
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'jsonnet/Components/T9Keyboard.libsonnet'
      - 'jsonnet/Constants/Keyboard.libsonnet'
      - 'jsonnet/Components/BasicStyle.libsonnet'
      - 'jsonnet/Components/NumericLandscape.libsonnet'
      - 'jsonnet/Components/NumericPortrait.libsonnet'
      - 'jsonnet/Components/AlphabeticKeyboard.libsonnet'
      - 'demo.png'
      - 'README.md'
      - 'jsonnet/main.jsonnet'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  # 所有发布任务使用同一个队列，避免同时生成相同版本号
  group: hamster3-t9-skin-copy-ios-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Jsonnet
        run: |
          sudo apt-get update
          sudo apt-get install -y jsonnet

      - name: Generate YAML from Jsonnet
        shell: bash
        run: |
          set -euo pipefail

          # Jsonnet 是唯一布局源文件；发布前重新生成 config/light/dark，
          # 防止只改源码却把旧 YAML 打进 .cskin。
          jsonnet jsonnet/main.jsonnet > /tmp/skin-generated.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          generated = json.loads(Path("/tmp/skin-generated.json").read_text(encoding="utf-8"))
          for name, content in generated.items():
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")
              print(f"Generated {target}")
          PY

          test -f config.yaml
          test -f light/landscapePinyin.yaml
          test -f dark/landscapePinyin.yaml

      - name: Determine next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          # 获取已有的 v2.x 版本标签
          latest_tag="$(
            git tag --list 'v2.*' |
            grep -E '^v2\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )"

          if [ -z "$latest_tag" ]; then
            # 第一次发布从 v2.0 开始
            version="v2.0"
          else
            # 每次发布自动增加 0.1
            minor="${latest_tag#v2.}"
            next_minor=$((minor + 1))
            version="v2.${next_minor}"
          fi

          echo "本次自动生成版本：$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package .cskin
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist/hamster3_T9_skin_copy_ios

          # 只打包皮肤需要的文件
          for item in config.yaml demo.png README.md dark light jsonnet; do
            if [ -e "$item" ]; then
              cp -R "$item" dist/hamster3_T9_skin_copy_ios/
            fi
          done

          test -f dist/hamster3_T9_skin_copy_ios/config.yaml
          test -d dist/hamster3_T9_skin_copy_ios/dark
          test -d dist/hamster3_T9_skin_copy_ios/light

          # cskin 必须是 zip 格式
          (cd dist && zip -r -9 hamster3_T9_skin_copy_ios.cskin hamster3_T9_skin_copy_ios)

          unzip -l dist/hamster3_T9_skin_copy_ios.cskin

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamster3_T9_skin_copy_ios-cskin
          path: dist/hamster3_T9_skin_copy_ios.cskin
          if-no-files-found: error

      - name: Generate release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          notes="dist/release-notes.md"

          # 获取上一个版本标签
          prev_tag="$(git describe --tags --abbrev=0 "$TARGET_SHA" 2>/dev/null || true)"

          changelog=""

          if [ -n "$prev_tag" ]; then
            changelog="$(
              git log \
                --pretty=format:'- [%h]('"${REPO_URL}"'/commit/%H) %s' \
                --no-merges \
                "${prev_tag}..${TARGET_SHA}" 2>/dev/null || true
            )"
          fi

          # 没有新提交时显示最近20条提交
          if [ -z "$changelog" ]; then
            changelog="$(
              git log -20 \
                --pretty=format:'- [%h]('"${REPO_URL}"'/commit/%H) %s' \
                "$TARGET_SHA" 2>/dev/null || true
            )"
          fi

          if [ -z "$changelog" ]; then
            changelog="- 本次版本没有新的提交记录"
          fi

          {
            echo "hamster3_T9_skin_copy_ios 九键皮肤（正式版本）"
            echo ""
            echo "版本号：${VERSION}"
            echo ""
            echo "下载 \`hamster3_T9_skin_copy_ios.cskin\`，分享到元书 App 导入即可。"
            echo ""
            echo "- 需要元书 1.6.0 或更高版本"
            echo "- 输入方案请选择「中文九键」"
            echo "- 皮肤名称：hamster3_T9_skin_copy_ios"
            echo ""
            echo "## 本次更新"
            echo ""
            printf '%s\n' "$changelog"
            echo ""
            echo "---"
            echo ""
            echo "提交记录：${REPO_URL}/commits/${VERSION}"
          } > "$notes"

          cat "$notes"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 每次使用自动生成的独立版本号
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: hamster3_T9_skin_copy_ios ${{ steps.version.outputs.version }}

          body_path: dist/release-notes.md

          files: dist/hamster3_T9_skin_copy_ios.cskin
          fail_on_unmatched_files: true

          # 禁止覆盖已有安装包
          overwrite_files: false

          # 自动标记最新版本，不删除历史版本
          make_latest: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
