name: Build T9-TWO skin

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t9-two-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉取完整历史，发布说明需要读取推送包含的提交记录
          fetch-depth: 0

      - name: Package .cskin
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist/T9-TWO

          # 只打包皮肤需要的文件，避免把 .github、.gitattributes 等带进 cskin
          for item in config.yaml demo.png README.md dark light jsonnet; do
            if [ -e "$item" ]; then
              cp -R "$item" dist/T9-TWO/
            fi
          done

          test -f dist/T9-TWO/config.yaml
          test -d dist/T9-TWO/dark
          test -d dist/T9-TWO/light

          # cskin 必须是 zip，且顶层文件夹名就是皮肤名
          (cd dist && zip -r -9 T9-TWO.cskin T9-TWO)
          unzip -l dist/T9-TWO.cskin

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: T9-TWO-cskin
          path: dist/T9-TWO.cskin
          if-no-files-found: error

      - name: Generate release notes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          TARGET_SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          notes="dist/release-notes.md"
          target="${AFTER_SHA:-$TARGET_SHA}"
          range=""

          # 版本 tag：列出上一个 tag 到当前 tag 之间的提交
          if [ "$REF_TYPE" = "tag" ]; then
            prev_tag="$(git describe --tags --abbrev=0 "${REF_NAME}^" 2>/dev/null || true)"
            if [ -n "$prev_tag" ] && [ "$prev_tag" != "$REF_NAME" ]; then
              range="${prev_tag}..${REF_NAME}"
            fi
          # 推送 main：列出本次推送包含的提交
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] \
            && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            range="${BEFORE_SHA}..${target}"
          fi

          log_format='- [%h]('"${REPO_URL}"'/commit/%H) %s'
          changelog=""

          if [ -n "$range" ]; then
            changelog="$(git log --pretty=format:"$log_format" --no-merges "$range" 2>/dev/null || true)"
            # 只有合并提交时，退回到包含合并提交的记录
            if [ -z "$changelog" ]; then
              changelog="$(git log --pretty=format:"$log_format" "$range" 2>/dev/null || true)"
            fi
          fi

          # 手动触发、首次推送或无法比对历史时，列出最近 20 条提交
          if [ -z "$changelog" ]; then
            changelog="$(git log -20 --pretty=format:"$log_format" "$target" 2>/dev/null || true)"
          fi

          if [ -z "$changelog" ]; then
            changelog="- 本次推送没有新的提交记录"
          fi

          {
            echo "T9-TWO 九键皮肤（自动构建）"
            echo ""
            echo "下载 \`T9-TWO.cskin\`，分享到元书 App 导入即可。"
            echo ""
            echo "- 需要元书 1.6.0 或更高版本"
            echo "- 输入方案请选择「中文九键」"
            echo "- 皮肤名称：T9-TWO"
            echo ""
            echo "## 本次更新"
            echo ""
            printf '%s\n' "$changelog"
            echo ""
            echo "---"
            echo ""
            echo "提交记录：${REPO_URL}/commits/${REF_NAME}"
          } > "$notes"

          cat "$notes"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 推送到 main 时更新 rolling 的 latest release；
          # 推送 v* tag 时创建对应版本 release。
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'T9-TWO 最新构建' }}
          # 发布说明由上一步根据本次推送的提交记录生成
          body_path: dist/release-notes.md
          files: dist/T9-TWO.cskin
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
